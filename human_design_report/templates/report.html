<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: DejaVu Sans, sans-serif; margin: 28px; color: #1f2937; }
    h1, h2 { color: #111827; }
    .section { margin-bottom: 24px; }
    .meta { background: #f3f4f6; padding: 12px; border-radius: 8px; }
    .block { white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Human Design Report</h1>
  <div class="meta section">
    <p><strong>Type:</strong> {{ chart.type or "N/A" }}</p>
    <p><strong>Strategy:</strong> {{ chart.strategy or "N/A" }}</p>
    <p><strong>Authority:</strong> {{ chart.authority or "N/A" }}</p>
    <p><strong>Profile:</strong> {{ chart.profile or "N/A" }}</p>
  </div>

  {% for key, value in blocks.items() %}
  <div class="section">
    <h2>{{ key.replace('_', ' ').title() }}</h2>
    <div class="block">{{ value }}</div>
  </div>
  {% endfor %}
</body>
</html>
